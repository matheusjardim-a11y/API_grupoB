# Banco de dados do Servidor de Alarmes do Elipse E3 (MySQL 8).
# Uso: copie .env.example para .env, troque as senhas e execute:  docker compose up -d
# O E3 cria as tabelas sozinho (botão de criar a estrutura no Alarm Server); aqui só sobe o servidor.

services:
  mysql:
    image: mysql:8.0                      # o E3 exige MySQL 8.0.11 ou superior
    container_name: e3-alarmes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alarmes_e3}
      MYSQL_USER: ${MYSQL_USER:-e3_alarmes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    ports:
      # Por padrão, só o próprio computador acessa. Para outro computador usar o banco,
      # troque MYSQL_BIND para 0.0.0.0 no .env (e libere a porta no firewall).
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Se o E3 reclamar do plugin de autenticação, descomente a linha abaixo e recrie o contêiner:
      # - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql         # os dados ficam neste volume local, fora do repositório
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: